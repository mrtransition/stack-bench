<!DOCTYPE html>
<html lang="zh-CN" data-theme="cyber">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StackBench · 全栈工程师工具集</title>
<script>
// 主题预加载，避免闪烁（默认赛博朋克）
try {
  var _t = localStorage.getItem('wb.theme') || 'cyber';
  document.documentElement.dataset.theme = _t;
} catch (e) { document.documentElement.dataset.theme = 'cyber'; }
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <button id="sidebar-toggle" class="icon-btn nav-toggle" type="button" title="折叠 / 展开导航" aria-label="折叠 / 展开导航">☰</button>
  <a class="brand" href="#/">
    <span class="logo-mark">▚</span><span class="logo-text">StackBench</span>
  </a>
  <button id="open-search" class="search-btn" type="button">
    <span class="s-ico">🔍</span><span class="s-txt">搜索工具、功能或关键词</span><kbd>Ctrl K</kbd>
  </button>
  <div class="topbar-right">
    <div class="agent-wrap">
      <button id="agent-pill" class="agent-pill is-checking" type="button" title="本地 Agent 状态">
        <span class="agent-dot"></span><span class="agent-label">Agent</span>
      </button>
      <div id="agent-pop" class="popover hidden">
        <div class="pop-head"><b>本地 Agent</b><span id="agent-pop-state" class="pop-state">检测中…</span></div>
        <p class="pop-desc">HTTP 调试、证书解析、JWT 验签等敏感能力由本机 Agent 执行，不上传云端。</p>
        <div class="pop-url" id="agent-pop-url">http://127.0.0.1:7420</div>
        <div class="pop-cmd"><code>cd agent &amp;&amp; node agent.js</code></div>
        <div class="pop-actions">
          <button id="agent-retry" class="btn" type="button">重新检测</button>
          <a class="btn" href="#/settings">Agent 设置</a>
        </div>
      </div>
    </div>
    <button id="theme-toggle" class="icon-btn" type="button" title="切换主题（赛博朋克 / 深色 / 浅色）" aria-label="切换主题">⚡</button>
    <a class="icon-btn" href="#/settings" title="设置" aria-label="设置">⚙</a>
  </div>
</header>

<div class="shell" id="shell">
  <aside class="sidebar" id="sidebar" aria-label="工具导航">
    <div id="sidebar-body"></div>
  </aside>
  <div class="sidebar-scrim hidden" id="sidebar-scrim"></div>
  <main id="app"></main>
</div>

<div id="palette" class="palette hidden">
  <div class="palette-box">
    <input id="palette-input" type="text" placeholder="输入工具名 / 关键词 / 分类…" autocomplete="off" spellcheck="false">
    <ul id="palette-results" role="listbox"></ul>
    <div class="palette-foot">↑↓ 选择 · Enter 打开 · Esc 关闭 · 排序：完全匹配 &gt; 关键词 &gt; 最近使用 &gt; 收藏</div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="vendor/js-yaml.min.js"></script>
<script src="vendor/qrcode.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
